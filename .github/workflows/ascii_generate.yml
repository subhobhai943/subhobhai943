name: Generate ASCII GIF

on:
  push:
    paths:
      - 'assets/logo_SUB.png'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow imageio numpy

      - name: Generate ASCII GIF
        run: python generate_ascii_gif.py assets/logo_SUB.png assets/ascii_logo.gif

      - name: Commit GIF output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ascii_logo.gif
          git diff --cached --quiet || git commit -m "chore: regenerate ASCII GIF [skip ci]"
          git push
